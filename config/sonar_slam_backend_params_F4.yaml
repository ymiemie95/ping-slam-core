# ════════════════════════════════════════════════════════════════
# sonar_slam_backend_params_tilepool.yaml —— 瓷砖异形小池版 (5.5×1.8m)
#
# 与大甲鱼池版的差异 = 全部"米"单位参数按 ~10:1 场景尺度缩放:
#   link_scan_maximum_distance 5.0→0.6  ★关键★ 原值下整池皆"近邻",
#     所有历史帧被近邻链吞掉、从回环候选中排除 → 回环从未产生
#   loop_search_maximum_distance 8.0→1.2, scan_buffer_max_dist 8.0→1.5
#   两套相关网格同缩(保持 40 格搜索数), 关键帧间距 0.2→0.05
#   响应门限(无量纲)暂不动, 待候选产生后按分位数定标
# ════════════════════════════════════════════════════════════════
sonar_slam_backend:
  ros__parameters:

    # ============================================================
    # ROS / 插件层
    # ============================================================
    use_sim_time: true

    odom_frame:  odom
    base_frame:  base_link
    map_frame:   map
    scan_topic:  /scan

    # 长包仿真时长 1906s, 默认 tf_buffer 30s 会静默丢帧
    tf_buffer_duration: 1200.0
    transform_timeout:  0.5

    mode: mapping

    solver_plugin:        solver_plugins::CeresSolver
    ceres_linear_solver:  SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type:    TRADITIONAL_DOGLEG
    # 放宽回环门限后必须有鲁棒核, 防单条假回环毁图
    ceres_loss_function:  HuberLoss

    resolution:              0.02
    map_update_interval:     1.0
    stack_size_to_use:       40000000
    enable_interactive_mode: false
    debug_logging:           true    # 盯 LOOP:fine 与 "Loop closed!", 调完关

    # 与 sonar_to_laserscan_params.yaml 一致
    max_laser_range: 2.0
    min_laser_range: 0.8

    # ============================================================
    # Karto Mapper 通用
    # ============================================================
    use_scan_matching: true
    use_scan_barycenter: false

    minimum_time_interval:   0.5
    minimum_travel_distance: 0.05
    minimum_travel_heading:  0.01

    scan_buffer_size: 12
    scan_buffer_maximum_scan_distance: 1.5

    # nearChain 实测响应仅 0.028-0.05, 原0.10一条边都连不上
    link_match_minimum_response_fine: 0.20
    link_scan_maximum_distance:       0.6

    # ============================================================
    # 回环检测
    # ============================================================
    do_loop_closing: true
    loop_match_minimum_chain_size: 5      # 方差门放开后用链长补一道保险

    # ★注意★ 此参数在 setParam 里被平方: 写10.0 → 内部100
    # (同被平方的还有 distance/angle_variance_penalty)
    loop_match_maximum_variance_coarse: 3.0

    loop_match_minimum_response_coarse: 0.20
    # ★关键改动★ 原0.15高于数据可达上限(SEQ响应P90=0.139):
    # 实测四条真回环 fine=0.0945/0.1091/0.1038/0.1048 全被0.15拒掉。
    # 0.08≈SEQ中位, 这四条全部放行。若仍无 "Loop closed!" 再降0.06,
    # 但同时盯 dHeading: 真重访≈0, ±1.9rad 的是180°对称假回环。
    loop_match_minimum_response_fine:   0.18

    loop_search_maximum_distance: 1.2

    # ============================================================
    # 相关网格 —— 顺序/近邻匹配的小网格
    # ============================================================
    correlation_search_space_dimension:       0.4    # 0.4/0.01=40 ✓
    correlation_search_space_resolution:      0.01
    correlation_search_space_smear_deviation: 0.04   # 稀疏点云, 2×分辨率

    # ============================================================
    # 回环相关网格 —— 大网格
    # ============================================================
    loop_search_space_dimension:       2.0    # 2.0/0.05=40 ✓
    loop_search_space_resolution:      0.05
    loop_search_space_smear_deviation: 0.05

    # ============================================================
    # 扫描匹配器
    # ============================================================
    distance_variance_penalty: 0.5
    # 内部平方为0.0625: 15°扣22%, 30°触底0.3 —— 压制假峰跳变的主力
    angle_variance_penalty:    0.25
    fine_search_angle_offset:  0.0034
    coarse_search_angle_offset: 0.34    # ±30°, 回环匹配(doPenalize=false)吸收圈间漂移
    coarse_angle_resolution:    0.034
    minimum_angle_penalty:    0.3       # 原0.9=惩罚失效, 60°跳变只扣10%
    minimum_distance_penalty: 0.5
    use_response_expansion: false       # 点少时它专找±60°假峰, 关掉

    # distance_variance_penalty: 0.5
    # # 内部平方为0.0625: 15°扣22%, 30°触底0.3 —— 压制假峰跳变的主力
    # angle_variance_penalty:    0.25
    # fine_search_angle_offset:  0.0052
    # coarse_search_angle_offset: 0.52    # ±30°, 回环匹配(doPenalize=false)吸收圈间漂移
    # coarse_angle_resolution:    0.052
    # minimum_angle_penalty:    0.3       # 原0.9=惩罚失效, 60°跳变只扣10%
    # minimum_distance_penalty: 0.5
    # use_response_expansion: false       # 点少时它专找±60°假峰, 关掉